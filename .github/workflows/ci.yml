name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Security boundaries from AGENTS.md. Runs first: a pull request that
      # breaks one of these should fail before anything else is considered,
      # including pull requests opened by Builder.io Fusion.
      - name: Guardrails
        run: npm run guardrails

      # next typegen writes the route types (LayoutProps, PageProps) into
      # .next/types. A fresh checkout has no .next, so tsc alone fails.
      - name: Typecheck
        run: npm run typecheck

      - name: Database permissions and yearly reports
        run: npm run test:database

      - name: Lint
        run: npm run lint

      # No secrets are provided to this job on purpose — the build must not
      # depend on real Supabase credentials.
      - name: Build
        run: npm run build

  # A committed .env file is a credential leak, not a style problem.
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed env files
        run: |
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$'; then
            echo "::error::A .env file is tracked in git. Remove it and rotate the keys it contained."
            exit 1
          fi
          echo "No tracked .env files."
